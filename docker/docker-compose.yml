version: '3.8'

services:

  php:
    build: ./php
    container_name: php_app
    volumes:
      - ../src:/var/www/html
    networks:
      - appnet

  nginx:
    image: nginx:latest
    container_name: nginx_app
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - appnet

  postgres:
    image: postgres:16
    container_name: postgres_local
    environment:
      POSTGRES_DB: sygt_data
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: elpasswordesesis
    ports:
      - "5433:5432"
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
    networks:
      - appnet

networks:
  appnet:
    driver: bridge